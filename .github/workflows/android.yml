name: APK Android (universal)

# Construye ARMSim-universal.apk (arm64-v8a, armeabi-v7a, x86, x86_64) en los servidores de GitHub.
# Se ejecuta en CADA push (a cualquier rama) y en los pull requests; también a mano (pestaña Actions ->
# "APK Android (universal)" -> Run workflow) y al publicar una etiqueta vX.Y (adjunta el APK a la Release).
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write      # solo para adjuntar el APK a una Release cuando se publica una etiqueta

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (acepta licencias)
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descargar SDL2
        run: bash android/fetch-sdl.sh

      - name: Construir el APK
        run: gradle -p android --no-daemon assembleRelease

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk ARMSim-universal.apk

      - name: Comprobar que contiene las 4 arquitecturas
        run: |
          unzip -l ARMSim-universal.apk | grep -E "lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libmain.so"
          test "$(unzip -l ARMSim-universal.apk | grep -cE 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libmain.so')" = "4"

      - uses: actions/upload-artifact@v4
        with:
          name: ARMSim-universal-apk
          path: ARMSim-universal.apk

      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ARMSim-universal.apk

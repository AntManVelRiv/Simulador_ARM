name: Build ARMSim

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------------------------------
          # Windows x64
          # -------------------------------------------------
          - name: armsim-windows-x64
            # windows-latest está migrando a Visual Studio 2026 (toolset 18.x, aún beta):
            # se fija windows-2022 (Visual Studio 2022 estable) para evitar builds que
            # fallan por el cambio de compilador, no por el propio código.
            os: windows-2022
            artifact: armsim-windows-x64
            executable: armsim.exe

          # -------------------------------------------------
          # Linux x64 (Ubuntu, Debian, Fedora, Arch, WSL...)
          # -------------------------------------------------
          - name: armsim-linux-x64
            os: ubuntu-22.04   # glibc 2.35: binario compatible con distros más antiguas que ubuntu-latest (glibc 2.39)
            artifact: armsim-linux-x64
            executable: armsim

          # -------------------------------------------------
          # Linux ARM64 — runner nativo (sin QEMU): Raspberry Pi 4/5 con
          # Raspberry Pi OS de 64 bits (el que trae por defecto desde 2022).
          # Para Raspberry Pi OS de 32 bits (armhf, modelos antiguos o Pi Zero/1/2)
          # no hay runner gratuito de GitHub: compílalo directamente en la propia
          # Pi con install-deps.sh (ver README).
          # -------------------------------------------------
          - name: armsim-linux-arm64
            os: ubuntu-22.04-arm
            artifact: armsim-linux-arm64
            executable: armsim

          # -------------------------------------------------
          # macOS ARM64
          # -------------------------------------------------
          - name: armsim-macos-arm64
            os: macos-15
            artifact: armsim-macos-arm64
            executable: armsim

    steps:
      # -----------------------------------------------------
      # Descargar código
      # -----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Instalar dependencias
      # -----------------------------------------------------
      - name: Instalar dependencias Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsdl2-dev \
            libgl1-mesa-dev

      - name: Instalar dependencias macOS
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sdl2

      # SDL2 no está en choco: se instala vía vcpkg y se pasa como toolchain a CMake.
      # Se cachea entre ejecuciones porque compilar SDL2 desde vcpkg tarda varios minutos.
      - name: Preparar vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg
          key: vcpkg-sdl2-x64-windows-${{ runner.os }}

      - name: Instalar dependencias Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y
          if (-not (Test-Path C:\vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          C:\vcpkg\vcpkg.exe install sdl2:x64-windows

      # Pone cl.exe (MSVC) en el PATH; sin esto, Ninja no encuentra compilador en Windows.
      - name: Configurar entorno MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # -----------------------------------------------------
      # Configurar CMake
      # -----------------------------------------------------
      # IMPORTANTE: cada línea es un "run:" independiente (sin continuadores \ o `)
      # para que funcione igual en bash (Linux/macOS) y en pwsh (Windows).
      - name: Configurar CMake (Linux)
        if: runner.os == 'Linux'
        # -static-libgcc/-static-libstdc++: evita que el binario también dependa de una
        # versión mínima de libstdc++/libgcc_s más nueva que la del sistema del usuario
        # (el mismo problema que GLIBC_2.38, pero para estas dos librerías).
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARMSIM_BUILD_TESTS=ON -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      - name: Configurar CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARMSIM_BUILD_TESTS=ON

      - name: Configurar CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARMSIM_BUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      # -----------------------------------------------------
      # Compilar
      # -----------------------------------------------------
      - name: Compilar
        run: cmake --build build --config Release --parallel

      # -----------------------------------------------------
      # Ejecutar pruebas
      # -----------------------------------------------------
      - name: Ejecutar tests
        working-directory: build
        run: ctest --output-on-failure -C Release

      # -----------------------------------------------------
      # Preparar paquete
      # -----------------------------------------------------
      - name: Preparar paquete
        shell: bash
        run: |
          mkdir -p package
          cp "build/${{ matrix.executable }}" package/
          cp -r assets package/ 2>/dev/null || true

          # En Windows hay que llevarse SDL2.dll: el ejecutable la enlaza dinámicamente
          # y sin ella no arranca al descomprimir el paquete en otra máquina.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "C:/vcpkg/installed/x64-windows/bin/SDL2.dll" package/
          fi

      # -----------------------------------------------------
      # Subir como artefacto de GitHub Actions
      # -----------------------------------------------------
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/

      # -----------------------------------------------------
      # Guardar para Release
      # -----------------------------------------------------
      - name: Comprimir paquete
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd package

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" *
          else
            tar -czf "../${{ matrix.artifact }}.tar.gz" *
          fi

      - name: Subir paquete para Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz

  # =========================================================
  # RELEASE
  # =========================================================

  release:
    name: Crear Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar paquetes
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.gz
          generate_release_notes: true
